<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#1f2937">
<title>Clock Card</title>
<style>
  :root { --bg:#f3f4f6; --card:#fff; --text:#111827; --muted:#6b7280; --in:#15803d; --out:#b91c1c; --warn:#b45309; --line:#d1d5db; }
  * { box-sizing: border-box; }
  body { margin:0; font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; background:var(--bg); color:var(--text); }
  main { max-width:480px; margin:0 auto; padding:16px; }
  h1 { font-size:1.5rem; margin:8px 0 4px; }
  h2 { font-size:1.1rem; margin:0 0 6px; }
  .muted { color:var(--muted); font-size:.95rem; margin:0 0 12px; }
  .card { background:var(--card); border:1px solid var(--line); border-radius:12px; padding:14px; margin:12px 0; }
  label { display:block; font-weight:600; margin:10px 0 6px; }
  select, input { width:100%; font-size:1rem; padding:12px; border:1px solid var(--line); border-radius:8px; background:#fff; }
  button { font:inherit; cursor:pointer; }
  .big { display:block; width:100%; border:0; border-radius:14px; color:#fff; font-size:1.6rem; font-weight:700; padding:26px 0; margin:12px 0; }
  .in { background:var(--in); } .out { background:var(--out); }
  .mid { width:100%; border:0; border-radius:10px; background:#1f2937; color:#fff; font-size:1.1rem; padding:14px 0; margin-top:10px; }
  .link { background:none; border:0; color:#2563eb; padding:8px 0 0; text-decoration:underline; }
  button:disabled { opacity:.45; cursor:not-allowed; }
  #gps.ok { color:var(--in); } #gps.warn { color:var(--warn); }
  #msg { min-height:1.5em; font-weight:600; padding:4px 2px; }
  #msg.ok { color:var(--in); } #msg.warn { color:var(--warn); } #msg.err { color:var(--out); }
  #dlg { position:fixed; inset:0; background:rgba(0,0,0,.55); display:flex; align-items:center; justify-content:center; padding:16px; z-index:10; }
  #dlg[hidden] { display:none; }
  #dlg .box { background:var(--card); border-radius:14px; padding:18px; width:100%; max-width:440px; max-height:90vh; overflow:auto; }
  #dlg h2 { font-size:1.25rem; margin:0 0 6px; }
  .opt { display:flex; align-items:center; gap:10px; padding:12px; border:1px solid var(--line); border-radius:10px; margin:8px 0; font-weight:600; }
  .opt input { width:auto; margin:0; transform:scale(1.3); }
  textarea { width:100%; font:inherit; font-size:1rem; padding:12px; border:1px solid var(--line); border-radius:8px; min-height:70px; margin-top:6px; }
  .row { display:flex; gap:10px; margin-top:14px; }
  .row button { flex:1; border:0; border-radius:10px; padding:14px 0; font-size:1.1rem; font-weight:700; }
  .cancel { background:#e5e7eb; color:#111827; } .ok-in { background:var(--in); color:#fff; } .ok-out { background:var(--out); color:#fff; }
  #dlgErr { color:var(--out); font-weight:600; min-height:1.2em; margin-top:6px; }
  .pill { display:inline-block; padding:3px 10px; border-radius:999px; font-weight:700; font-size:.9rem; }
  .p-Pending { background:#fce5cd; color:#7c2d12; } .p-Approved { background:#d9ead3; color:#14532d; } .p-Declined { background:#f4cccc; color:#7f1d1d; }
  .req { border:1px solid var(--line); border-radius:10px; padding:12px; margin:10px 0; }
  .req b { font-size:1.05rem; }
  .req .row { margin-top:10px; }
  .req select { margin-top:8px; }
  .approve { background:var(--in); color:#fff; } .decline { background:var(--out); color:#fff; }
  #otMsg, #apMsg { font-weight:600; min-height:1.2em; margin-top:8px; }
  #otMsg.ok, #apMsg.ok { color:var(--in); } #otMsg.err, #apMsg.err { color:var(--out); }
</style>
</head>
<body>
<main>
  <h1 id="hello">Clock Card</h1>
  <p id="last" class="muted">Loading…</p>

  <section class="card">
    <div id="gps" class="muted">Finding your location…</div>
    <label for="site">Job site</label>
    <select id="site"></select>
    <button id="refresh" class="link" type="button">Refresh location</button>
  </section>

  <button id="btnIn" class="big in" type="button" disabled>CLOCK IN</button>
  <button id="btnOut" class="big out" type="button" disabled>CLOCK OUT</button>
  <div id="msg" role="status"></div>

  <section id="otCard" class="card" hidden>
    <h2>Overtime today</h2>
    <p id="otStatus" class="muted">No overtime requested. Normal finish is 17:00.</p>
    <label for="otUntil">Work until</label>
    <select id="otUntil"></select>
    <label for="otReason">Reason</label>
    <input id="otReason" maxlength="200" placeholder="e.g. Finish concrete pour" autocomplete="off">
    <button id="btnOt" class="mid" type="button">Request overtime</button>
    <div id="otMsg"></div>
  </section>

  <section id="apCard" class="card" hidden>
    <h2>Overtime to approve</h2>
    <div id="apList"></div>
    <div id="apMsg"></div>
  </section>

  <section id="mgr" class="card" hidden>
    <h2>Save this spot as a new site</h2>
    <p class="muted">Stand at the main work area of the site. Wait until accuracy is under 30 m (tap Refresh location), then save.</p>
    <input id="newSite" maxlength="60" placeholder="Site name, e.g. Umhlanga Block C" autocomplete="off">
    <button id="btnAdd" class="mid" type="button" disabled>Save site</button>
  </section>
</main>

<div id="dlg" hidden>
  <div class="box" role="dialog" aria-modal="true" aria-labelledby="dlgTitle">
    <h2 id="dlgTitle"></h2>
    <p id="dlgText" class="muted"></p>
    <div id="dlgReasons"></div>
    <textarea id="dlgOther" placeholder="Please type the reason" maxlength="200" hidden></textarea>
    <div id="dlgErr"></div>
    <div class="row">
      <button id="dlgCancel" class="cancel" type="button">Cancel</button>
      <button id="dlgOk" type="button">Confirm</button>
    </div>
  </div>
</div>

<script>
  // Paste the Apps Script web app URL here (ends in /exec)
  const API_URL = 'https://script.google.com/macros/s/AKfycbx7IniPyBsAl3M1bU9RyWyXgh2IdczTyWs6QIJKd-Gmacvvr6reNTrf93UeTXiSiUau/exec';

  const token = new URLSearchParams(location.search).get('t');
  const $ = (id) => document.getElementById(id);
  let sites = [], pos = null, role = '', ready = false, busy = false, userPicked = false, lastSeen = null;
  let cfg = { tz: 'Africa/Johannesburg', start: '08:00', end: '17:00', grace: 5, workDays: [1, 2, 3, 4, 5], maxOt: '20:00' };

  const REASONS = {
    LATE: ['Traffic', 'Transport problem', 'Was at another site first', 'Approved by supervisor', 'Other'],
    EARLY: ['Family emergency', 'Medical / sick', 'Sent home by supervisor', 'Job finished / site closed', 'Going to another site', 'Other'],
  };

  // Current time and weekday in South Africa, whatever the phone's settings
  function nowLocal() {
    const parts = {};
    new Intl.DateTimeFormat('en-GB', { timeZone: cfg.tz, hour: '2-digit', minute: '2-digit', hour12: false, weekday: 'short' })
      .formatToParts(new Date()).forEach((p) => { parts[p.type] = p.value; });
    const day = { Mon: 1, Tue: 2, Wed: 3, Thu: 4, Fri: 5, Sat: 6, Sun: 7 }[parts.weekday];
    return { hhmm: (parts.hour === '24' ? '00' : parts.hour) + ':' + parts.minute, day: day };
  }
  function addMin(hhmm, m) {
    const [h, mm] = hhmm.split(':').map(Number);
    const t = h * 60 + mm + m;
    return String(Math.floor(t / 60)).padStart(2, '0') + ':' + String(t % 60).padStart(2, '0');
  }

  // Confirmation box; asks for a reason when clocking in late or out early. Resolves to {ok, reason}.
  function askConfirm(action, siteText) {
    const n = nowLocal();
    const workDay = cfg.workDays.indexOf(n.day) >= 0;
    let kind = '';
    if (workDay && action === 'IN' && !lastSeen && n.hhmm > addMin(cfg.start, cfg.grace)) kind = 'LATE';
    if (workDay && action === 'OUT' && n.hhmm < cfg.end) kind = 'EARLY';

    $('dlgTitle').textContent = 'Clock ' + action + ' at ' + n.hhmm + '?';
    $('dlgText').textContent = 'Site: ' + siteText + (kind === 'LATE' ? '. Start time is ' + cfg.start + ' – please give a reason.'
      : kind === 'EARLY' ? '. Finish time is ' + cfg.end + ' – please give a reason for leaving early.' : '');
    $('dlgOk').className = action === 'IN' ? 'ok-in' : 'ok-out';
    $('dlgOk').textContent = 'Clock ' + action;
    $('dlgErr').textContent = '';
    $('dlgOther').value = '';
    $('dlgOther').hidden = true;
    const box = $('dlgReasons');
    box.innerHTML = '';
    (REASONS[kind] || []).forEach((r) => {
      const l = document.createElement('label');
      l.className = 'opt';
      const i = document.createElement('input');
      i.type = 'radio'; i.name = 'reason'; i.value = r;
      i.addEventListener('change', () => { $('dlgOther').hidden = r !== 'Other'; $('dlgErr').textContent = ''; if (r === 'Other') $('dlgOther').focus(); });
      l.appendChild(i);
      l.appendChild(document.createTextNode(r));
      box.appendChild(l);
    });
    $('dlg').hidden = false;

    return new Promise((resolve) => {
      const done = (res) => { $('dlg').hidden = true; $('dlgOk').onclick = null; $('dlgCancel').onclick = null; resolve(res); };
      $('dlgCancel').onclick = () => done({ ok: false });
      $('dlgOk').onclick = () => {
        if (!kind) return done({ ok: true, reason: '' });
        const picked = box.querySelector('input[name=reason]:checked');
        if (!picked) { $('dlgErr').textContent = 'Please choose a reason.'; return; }
        let reason = picked.value;
        if (reason === 'Other') {
          const txt = $('dlgOther').value.trim();
          if (txt.length < 3) { $('dlgErr').textContent = 'Please type the reason.'; return; }
          reason = 'Other: ' + txt;
        }
        done({ ok: true, reason: reason });
      };
    });
  }

  function show(text, kind) { $('msg').textContent = text; $('msg').className = kind || ''; }

  function distM(lat1, lon1, lat2, lon2) {
    const R = 6371000, r = Math.PI / 180;
    const dLat = (lat2 - lat1) * r, dLon = (lon2 - lon1) * r;
    const a = Math.sin(dLat / 2) ** 2 + Math.cos(lat1 * r) * Math.cos(lat2 * r) * Math.sin(dLon / 2) ** 2;
    return 2 * R * Math.asin(Math.sqrt(a));
  }
  const fmtDist = (m) => m < 1000 ? Math.round(m) + ' m' : (m / 1000).toFixed(1) + ' km';

  function fillSites() {
    const sel = $('site');
    const prev = sel.value;
    sel.innerHTML = '';
    const list = sites.map((s) => Object.assign({}, s, { d: pos ? distM(pos.lat, pos.lng, s.lat, s.lng) : null }));
    if (pos) list.sort((a, b) => a.d - b.d);
    list.forEach((s) => {
      const o = document.createElement('option');
      o.value = s.name;
      o.textContent = s.name + (s.d != null ? ' (' + fmtDist(s.d) + ')' : '');
      sel.appendChild(o);
    });
    const none = document.createElement('option');
    none.value = '';
    none.textContent = 'Not at a listed site';
    sel.appendChild(none);

    if (userPicked && [...sel.options].some((o) => o.value === prev)) sel.value = prev;
    else if (pos && list.length && list[0].d <= list[0].radius) sel.value = list[0].name;
    else sel.value = '';
  }

  function updateButtons() {
    const can = ready && pos && !busy;
    $('btnIn').disabled = !can;
    $('btnOut').disabled = !can;
    $('btnAdd').disabled = !can || !$('newSite').value.trim();
  }

  function setLast(l) {
    lastSeen = l || null;
    $('last').textContent = l
      ? 'Today: ' + (l.action === 'IN' ? 'clocked in' : 'clocked out') + ' at ' + l.time + ' – ' + l.site
      : 'Not clocked in yet today.';
  }

  function locate() {
    return new Promise((resolve, reject) => {
      if (!navigator.geolocation) {
        $('gps').textContent = 'This browser cannot share location.';
        $('gps').className = 'warn';
        return reject(new Error('Location not supported on this phone.'));
      }
      $('gps').textContent = 'Finding your location…';
      $('gps').className = 'muted';
      navigator.geolocation.getCurrentPosition((p) => {
        pos = { lat: p.coords.latitude, lng: p.coords.longitude, acc: Math.round(p.coords.accuracy), at: Date.now() };
        $('gps').textContent = 'Location found – accurate to about ' + pos.acc + ' m';
        $('gps').className = pos.acc > 100 ? 'warn' : 'ok';
        fillSites();
        updateButtons();
        resolve(pos);
      }, (err) => {
        const t = err.code === 1
          ? 'Location is blocked. Allow location for this page in your browser settings, then tap Refresh location.'
          : 'Could not get your location. Check that Location/GPS is on, then tap Refresh location.';
        $('gps').textContent = t;
        $('gps').className = 'warn';
        reject(new Error(t));
      }, { enableHighAccuracy: true, timeout: 20000, maximumAge: 0 });
    });
  }

  async function send(action) {
    if (busy) return;
    let reason = '';
    if (action !== 'ADD_SITE') {
      const sel = $('site');
      const siteText = sel.value ? sel.value : 'not at a listed site';
      const ans = await askConfirm(action, siteText);
      if (!ans.ok) return;
      reason = ans.reason;
    }
    busy = true; updateButtons();
    const before = lastSeen;
    let sent = false;
    try {
      if (!pos || Date.now() - pos.at > 60000) {            // fresh fix if older than 1 minute
        show('Getting your location…');
        await locate();
      }
      const body = { t: token, action: action, lat: pos.lat, lng: pos.lng, acc: pos.acc };
      if (action === 'ADD_SITE') body.siteName = $('newSite').value.trim();
      else { body.site = $('site').value; body.reason = reason; }

      show('Sending…');
      sent = true;
      const res = await fetchJson(API_URL, { method: 'POST', body: JSON.stringify(body) }, 30000);
      if (!res.ok) throw new Error(res.error || 'Something went wrong.');

      show(res.message, res.flags && res.flags.length ? 'warn' : 'ok');
      if (res.last) setLast(res.last);
      if ('ot' in res) setOt(res.ot);
      if (res.sites) { sites = res.sites; $('newSite').value = ''; userPicked = false; fillSites(); }
    } catch (e) {
      if (sent && action !== 'ADD_SITE' && (e.name === 'AbortError' || e instanceof TypeError || e instanceof SyntaxError)) {
        // The reply got lost or was too slow – check whether it saved anyway
        show('No reply yet – checking whether it saved…', 'warn');
        const now = await refreshLast();
        if (now && now.action === action && (!before || now.time !== before.time || now.action !== before.action)) {
          show('Saved: clocked ' + action + ' at ' + now.time + ' – ' + now.site + '. No need to tap again.', 'ok');
        } else if (now) {
          show('It did not save. Please tap CLOCK ' + action + ' again.', 'err');
        } else {
          show('No connection. Do NOT tap again yet – reload the page in a minute to see if it saved.', 'err');
        }
      } else {
        show(e instanceof TypeError || e.name === 'AbortError' ? 'No connection – check your data and try again.' : e.message, 'err');
      }
    }
    busy = false; updateButtons();
  }

  // fetch with a time limit, returning parsed JSON
  async function fetchJson(url, opts, ms) {
    const ctrl = new AbortController();
    const timer = setTimeout(() => ctrl.abort(), ms);
    try {
      const r = await fetch(url, Object.assign({}, opts, { signal: ctrl.signal }));
      return await r.json();
    } finally {
      clearTimeout(timer);
    }
  }

  // re-reads today's last entry from the sheet; returns it, or null if it can't connect
  async function refreshLast() {
    try {
      const res = await fetchJson(API_URL + '?action=init&t=' + encodeURIComponent(token), {}, 20000);
      if (!res.ok) return null;
      setLast(res.last);
      return res.last || { action: '', time: '', site: '' };
    } catch (e) {
      return null;
    }
  }

  async function init() {
    if (!token) { $('last').textContent = ''; show('This link is missing your personal code. Ask the office for your link.', 'err'); return; }
    locate().catch(() => {});
    try {
      const res = await fetchJson(API_URL + '?action=init&t=' + encodeURIComponent(token), {}, 30000);
      if (!res.ok) { $('last').textContent = ''; show(res.error, 'err'); return; }
      $('hello').textContent = 'Hi ' + res.name;
      role = String(res.role || '').toLowerCase();
      sites = res.sites || [];
      if (res.cfg) cfg = Object.assign(cfg, res.cfg);
      fillOtTimes();
      setOt(res.ot);
      $('otCard').hidden = false;
      setApprovals(res.approvals || [], role === 'manager' || role === 'director');
      if (res.canAddSites || role === 'manager') $('mgr').hidden = false;
      setLast(res.last);
      ready = true;
      fillSites();
      updateButtons();
    } catch (e) {
      $('last').textContent = '';
      show('No connection – check your data and reload the page.', 'err');
    }
  }

  /* ---------- Overtime ---------- */
  function timeOptions(selected) {
    const out = [];
    for (let t = addMin(cfg.end, 30); t <= cfg.maxOt; t = addMin(t, 30)) out.push(t);
    return out.map((t) => '<option' + (t === selected ? ' selected' : '') + '>' + t + '</option>').join('');
  }
  function fillOtTimes() { $('otUntil').innerHTML = timeOptions(addMin(cfg.end, 60)); }

  function setOt(ot) {
    const el = $('otStatus');
    if (!ot) { el.textContent = 'No overtime requested. Normal finish is ' + cfg.end + '.'; return; }
    el.innerHTML = '';
    const pill = document.createElement('span');
    pill.className = 'pill p-' + ot.status;
    pill.textContent = ot.status;
    el.appendChild(pill);
    el.appendChild(document.createTextNode(
      ot.approvedUntil && ot.status !== 'Approved' ? ' Latest request until ' + ot.until + '. Already approved until ' + ot.approvedUntil + '.'
      : ot.status === 'Approved' ? ' You may work until ' + ot.until + '. You will be clocked out automatically then.'
      : ot.status === 'Declined' ? ' Not approved – please clock out by ' + cfg.end + '.'
      : ' Until ' + ot.until + ' – waiting for your supervisor.'));
  }

  async function requestOt() {
    const until = $('otUntil').value, reason = $('otReason').value.trim();
    if (reason.length < 3) { $('otMsg').textContent = 'Please type a short reason.'; $('otMsg').className = 'err'; return; }
    $('btnOt').disabled = true; $('otMsg').textContent = 'Sending…'; $('otMsg').className = '';
    try {
      const res = await fetchJson(API_URL, { method: 'POST', body: JSON.stringify({ t: token, action: 'OT_REQUEST', until: until, reason: reason }) }, 30000);
      if (!res.ok) throw new Error(res.error);
      setOt(res.ot);
      $('otReason').value = '';
      $('otMsg').textContent = res.message; $('otMsg').className = 'ok';
    } catch (e) {
      $('otMsg').textContent = e instanceof TypeError || e.name === 'AbortError' ? 'No connection – try again.' : e.message;
      $('otMsg').className = 'err';
    }
    $('btnOt').disabled = false;
  }

  function setApprovals(list, isManager) {
    $('apCard').hidden = !(list.length || isManager);
    const box = $('apList');
    box.innerHTML = '';
    if (!list.length) { box.innerHTML = '<p class="muted">No overtime requests from your team today.</p>'; return; }
    list.forEach((r) => {
      const d = document.createElement('div');
      d.className = 'req';
      const head = document.createElement('div');
      const b = document.createElement('b'); b.textContent = r.name;
      const pill = document.createElement('span'); pill.className = 'pill p-' + r.status; pill.textContent = r.status;
      head.append(b, ' ', pill);
      const info = document.createElement('div');
      info.className = 'muted';
      info.textContent = 'Until ' + r.until + ' – ' + r.reason;
      d.append(head, info);
      if (r.status === 'Pending') {
        const sel = document.createElement('select');
        sel.innerHTML = timeOptions(r.until);
        const row = document.createElement('div'); row.className = 'row';
        const no = document.createElement('button'); no.type = 'button'; no.className = 'decline'; no.textContent = 'Decline';
        const yes = document.createElement('button'); yes.type = 'button'; yes.className = 'approve'; yes.textContent = 'Approve';
        no.onclick = () => decide(r.id, 'Declined', '');
        yes.onclick = () => decide(r.id, 'Approved', sel.value);
        row.append(no, yes);
        d.append(sel, row);
      }
      box.appendChild(d);
    });
  }

  async function decide(id, decision, until) {
    $('apMsg').textContent = 'Saving…'; $('apMsg').className = '';
    $('apList').querySelectorAll('button').forEach((b) => { b.disabled = true; });
    try {
      const res = await fetchJson(API_URL, { method: 'POST', body: JSON.stringify({ t: token, action: 'OT_DECIDE', id: id, decision: decision, until: until }) }, 30000);
      if (!res.ok) throw new Error(res.error);
      setApprovals(res.approvals || [], true);
      $('apMsg').textContent = res.message; $('apMsg').className = 'ok';
    } catch (e) {
      $('apMsg').textContent = e instanceof TypeError || e.name === 'AbortError' ? 'No connection – try again.' : e.message;
      $('apMsg').className = 'err';
      $('apList').querySelectorAll('button').forEach((b) => { b.disabled = false; });
    }
  }

  $('btnOt').addEventListener('click', requestOt);
  $('btnIn').addEventListener('click', () => send('IN'));
  $('btnOut').addEventListener('click', () => send('OUT'));
  $('btnAdd').addEventListener('click', () => send('ADD_SITE'));
  $('refresh').addEventListener('click', () => locate().catch(() => {}));
  $('site').addEventListener('change', () => { userPicked = true; });
  $('newSite').addEventListener('input', updateButtons);
  init();
</script>
</body>
</html>
